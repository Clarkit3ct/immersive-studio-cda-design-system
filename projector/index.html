<!DOCTYPE html>
<!--
  project: CDA Immersive Studio
  type: the SURFACE PLAYER — everything a projector shows, rendered inside a calibrated frame
  status: v6 (2026-09-11) [S136-cda-choreography] — deck part {type:'plan'} = a scaled sheet at 1:1 (Friday art walk) · plan layer cleared between slides ·
          v5 (2026-09-10) [S135-cda-choreography] — media served from R2 (MEDIA_BASE) · — event-day: typewriter welcome lines, thank-you header + real RSVPs (names.json), video falls back to the mark
  the rule of v3: every variation starts from and returns to ONE rest state (the lit line, soft halo,
        nothing else) and HOLDS it for REST seconds. No glow left behind, no jump on restart.
  scenes: loop      power-on → mark ×N → variation → mark ×N → next variation …
          mark      the brand loop itself, ported from loader.js so it has a rest state and no clipped glow
          poweron · poweroff · gridripple · corridor · plotter · figure · typewriter · breathe   (each loops alone)
          words · thanks · thanks2 (floating screensaver) · grid · plan · video · black
  frame:  ?f=x,y,w,h (the calibrate bookmark) or the frame calibrate saved for ?s=east|west|floor
  remote: BroadcastChannel 'isc-show' — /preview/desk/ drives it. Every switch fades through black.
  params: &n=7 (mark cycles between variations) &hold=45 &lines=a|b|c &clines=… (corridor) &tlines=… (typewriter)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immersive Studio · show</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--off:#F7F7F3;--dove:#A5A194;--olive:#868269;--void:#000}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void);overflow:hidden;cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><path d='M13 1v8M13 17v8M1 13h8M17 13h8' stroke='%23a0a0a0' stroke-width='1.6' stroke-linecap='round'/></svg>") 13 13, crosshair}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--off);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;overflow:hidden;background:var(--void)}
  #fx{position:absolute;left:0;top:0}
  #wordmark{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);white-space:nowrap;
    font-weight:300;letter-spacing:.42em;color:var(--dove);text-transform:uppercase;opacity:0;transition:opacity 2.4s ease}
  #wordmark.on{opacity:.85}
  #cards{position:absolute;inset:0}
  .line{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 6%;opacity:0;transition:opacity 2.8s ease}
  .line.on{opacity:1}
  .line .t{font-weight:200;letter-spacing:.02em;line-height:1.05;white-space:nowrap}
  .line .s{font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--dove);margin-top:.5em}
  .line .k{font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:var(--olive);margin-bottom:.7em}
  .line svg{display:block;margin:0 auto .6em;overflow:visible}
  .line svg path,.line svg circle,.line svg rect,.line svg polyline{fill:none;stroke:var(--off);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;vector-effect:non-scaling-stroke}
  .line.on svg path,.line.on svg circle,.line.on svg rect,.line.on svg polyline{animation:draw 1.8s ease .3s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #vid{position:absolute;left:0;top:0;width:100%;height:100%;display:none;background:#000;object-fit:fill}
  #planwrap{position:absolute;inset:0;display:none;overflow:hidden}
  #blocks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .blk{position:absolute;box-sizing:border-box;border:2px solid #fff;background:rgba(255,255,255,.14);color:#fff;mix-blend-mode:difference;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;cursor:move;user-select:none;transform-origin:50% 50%;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:300;letter-spacing:.06em;line-height:1.15}
  .blk.on{border-width:3px;background:rgba(255,255,255,.22)}
  .blk.round{border-radius:50%}
  .blk.door{border:0;background:none;overflow:visible}
  .blk.door i{position:absolute;left:0;bottom:0;width:100%;height:100%;border:2px solid #fff;border-left:0;border-bottom:0;border-radius:0 100% 0 0;box-sizing:border-box}
  .blk.door b{position:absolute;left:0;bottom:0;width:3px;height:100%;background:#fff}
  #ink{position:absolute;inset:0;pointer-events:none;mix-blend-mode:difference}
  #ink.on{pointer-events:auto;cursor:crosshair}
  #plan{position:absolute;left:0;top:0;transform-origin:0 0}
  #veil{position:absolute;inset:0;background:#000;opacity:1;transition:opacity .7s ease;pointer-events:none}
  #hint{position:fixed;left:14px;bottom:10px;font:10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#333}
  #hint.hide{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx"></canvas>
  <div id="wordmark">Immersive Studio</div>
  <div id="cards"></div>
  <video id="vid" muted loop playsinline></video>
  <div id="planwrap"><canvas id="plan"></canvas></div><div id="blocks"></div><canvas id="ink"></canvas>
  <div id="mask" style="position:absolute;inset:0;pointer-events:none;display:none"></div>
  <div id="veil"></div>
</div>
<div id="hint"></div>


<script type="module">
/* media lives on Cloudflare R2 (bucket immersive-studio-media); only the index.json files stay on Vercel. Empty MEDIA_BASE = serve from this origin. */
const MEDIA_BASE='';
const MEDIA=u=>{if(!u||!MEDIA_BASE)return u;const m=String(u).match(/^(?:\/preview\/show\/)?media\/(.+)$/);return m?MEDIA_BASE+'/'+m[1]:u};
/* ═══════════ frame + stage ═══════════ */
const q=new URLSearchParams(location.search);
const surf=q.get('s')||'east';
const SURF={east:{w:49.19,h:12.52},west:{w:49.19,h:13.08},floor:{w:71.33,h:41.69}};   /* Roger + Jeremy's tape, 2026-09-14: floor A 24'-7½" of 25', B 117⅛" of 10' · west A 119¼" of 10', B 98½" of 8' · east A 119¼", B 94¼". A saved calibration on the PC still wins over these. */
const ft={w:+(q.get('w')||(SURF[surf]||SURF.east).w),h:+(q.get('h')||(SURF[surf]||SURF.east).h)};
try{const sv=localStorage.getItem('isc-ft-'+surf);if(sv&&!q.get('w')){const o=JSON.parse(sv);ft.w=o.w;ft.h=o.h}}catch(e){}   /* the feet calibrate saved (inset frames, tape corrections) */
/* Roger + Jeremy's tape, 2026-09-14, applied ONCE to the feet this PC has saved. The bars: floor 25' read 24'-7½", 10' read 117½" · west 10' read 119¼", 8' read 98½" · east 10' read 119¼", 8' read 94¼". A fresh browser already starts from corrected defaults, so only a saved calibration is scaled. */
const TAPE_0914={floor:[295.5/300,117.5/120],west:[119.25/120,98.5/96],east:[119.25/120,94.25/96]};
try{const k='isc-tape-0914-'+surf;if(!localStorage.getItem(k)){const t=TAPE_0914[surf],sv=localStorage.getItem('isc-ft-'+surf);if(t&&sv){ft.w=+(ft.w*t[0]).toFixed(3);ft.h=+(ft.h*t[1]).toFixed(3);localStorage.setItem('isc-ft-'+surf,JSON.stringify({w:ft.w,h:ft.h}))}localStorage.setItem(k,'1')}}catch(e){}
/* calibration.json — the studio's frames and feet, exported from the desk and committed. Used only when this browser has nothing saved. */
const CAL=await fetch('calibration.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null);   /* saved from the desk (Displays → save calibration to the studio), else the committed file */
try{const c=CAL&&CAL[surf];if(c&&c.ft&&!localStorage.getItem('isc-ft-'+surf)&&!q.get('w')){ft.w=+c.ft.w;ft.h=+c.ft.h}}catch(e){}
let F=null;
if(q.get('f')){const a=q.get('f').split(',').map(Number);if(a.length===4&&a.every(n=>!isNaN(n)))F={x:a[0],y:a[1],w:a[2],h:a[3]}}
if(!F&&!q.get('mock')){try{const s=localStorage.getItem('isc-frame-'+surf);if(s)F=JSON.parse(s)}catch(e){}}
if(!F&&!q.get('mock')&&CAL&&CAL[surf]&&CAL[surf].frame)F={...CAL[surf].frame};
if(!F||F.w<40){F={x:0,y:0,w:innerWidth,h:innerHeight};if(innerWidth<40)addEventListener('resize',()=>location.reload(),{once:true});}
const $=id=>document.getElementById(id);
const stage=$('stage'),fx=$('fx'),wm=$('wordmark'),cards=$('cards'),vid=$('vid'),planwrap=$('planwrap'),plan=$('plan'),veil=$('veil'),hint=$('hint');
Object.assign(stage.style,{left:F.x+'px',top:F.y+'px',width:F.w+'px',height:F.h+'px'});
if(q.get('mirror'))hint.style.display='none';   /* a mirror tile on the remote: no status label */
const DPR=Math.min(devicePixelRatio||1,2);
fx.width=F.w*DPR;fx.height=F.h*DPR;fx.style.width=F.w+'px';fx.style.height=F.h+'px';
const ctx=fx.getContext('2d');ctx.scale(DPR,DPR);
const BOX=(()=>{const h=Math.round(F.h*0.78),w=Math.round(h*0.72);return{w,h,left:Math.round(F.w/2-w/2),top:Math.round(F.h/2-0.56*h)}})();
wm.style.fontSize=Math.max(14,Math.round(F.h*0.045))+'px';
const pxPerFt=()=>(F.w/ft.w+F.h/ft.h)/2;
const FONT=(w,px)=>`${w} ${px}px 'Hanken Grotesk',system-ui,sans-serif`;
const showHint=s=>{hint.textContent=`${s} · ${surf} · ${F.x},${F.y} ${F.w}×${F.h} · H hides`};
document.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')hint.classList.toggle('hide')});

/* ═══════════ the mark geometry (ported from loader.js; same box, same numbers) ═══════════ */
const MARK={xL:290,xR:560,cy:500,hL:340,zL:1.0,zR:2.0,cols:12,rows:22,rNear:6.2,rMin:0.7,sizeExp:2.75,fieldEnd:0.88,coreW:6.5,bleedW:140,railThick:2.2,pad:55};
const HFAR=MARK.hL/MARK.zR;
const persp=(u,qL,qR)=>((1-u)*qL*MARK.zL+u*qR*MARK.zR)/((1-u)*MARK.zL+u*MARK.zR);
const halfH=x=>{const t=(x-MARK.xL)/(MARK.xR-MARK.xL);return MARK.hL+(HFAR-MARK.hL)*t};
const VB=(()=>{const x=MARK.xL-MARK.rNear-MARK.pad,y=MARK.cy-MARK.hL-MARK.rNear-MARK.pad;return{x,y,w:MARK.xR+MARK.pad-x,h:2*(MARK.hL+MARK.rNear+MARK.pad)}})();
const BLEED=[[0,0],[0.42,0.025],[0.66,0.08],[0.84,0.24],[0.94,0.58],[1,1]], RAIL=[[0,0],[0.45,0.1],[0.75,0.42],[1,1]];
const G=(()=>{const pad=.03,K=Math.min(BOX.w*(1-2*pad)/VB.w,BOX.h*(1-2*pad)/VB.h),cx0=VB.x+VB.w/2,cy0=VB.y+VB.h/2;
  const mapX=x=>BOX.left+BOX.w/2+(x-cx0)*K,mapY=y=>BOX.top+BOX.h/2+(y-cy0)*K;const dots=[];
  for(let i=0;i<MARK.cols;i++){const u=(i/(MARK.cols-1))*MARK.fieldEnd,x=persp(u,MARK.xL,MARK.xR),h=persp(u,MARK.hL,HFAR);
    const r=Math.max(MARK.rMin,MARK.rNear*Math.pow(h/MARK.hL,MARK.sizeExp));
    for(let j=0;j<MARK.rows;j++){const v=j/(MARK.rows-1);dots.push({u,v,i,j,X:mapX(x),Y:mapY(MARK.cy+h*(2*v-1)),R:r*K,rand:Math.random()})}}
  return{K,dots,mapX,mapY,xRc:mapX(MARK.xR),xLc:mapX(MARK.xL),cyc:mapY(MARK.cy),hFc:HFAR*K,hLc:MARK.hL*K,cw:Math.max(1.5,MARK.coreW*K),mcx:mapX((MARK.xL+MARK.xR)/2)}})();
const ink=a=>`rgba(247,247,243,${Math.max(0,Math.min(1,a))})`, white=a=>`rgba(255,255,255,${Math.max(0,Math.min(1,a))})`;
const clamp01=n=>Math.max(0,Math.min(1,n)), lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, easeO=t=>1-Math.pow(1-t,3), easeI=t=>t*t*t, easeOB=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const seg=(t,a,b)=>clamp01((t-a)/(b-a)), bump=(t,a,b)=>Math.sin(Math.PI*seg(t,a,b));
const REST=3.0;                      /* seconds every variation holds the rest state at its end */
const RESTBLOOM=0.3;                 /* the halo the line always carries at rest */
function clear(){ctx.clearRect(0,0,F.w,F.h)}
function bloom(a,cx=G.xRc,cy=G.cyc){if(a<=0.002)return;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,F.w*0.38);
  g.addColorStop(0,ink(0.15*a));g.addColorStop(0.22,ink(0.085*a));g.addColorStop(0.5,ink(0.028*a));g.addColorStop(0.8,ink(0.006*a));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,F.w,F.h)}
function wash(a){if(a<=0.002)return;const R=Math.max(F.w,F.h)*0.8;const g=ctx.createRadialGradient(G.xRc,G.cyc,0,G.xRc,G.cyc,R);g.addColorStop(0,ink(a));g.addColorStop(0.35,ink(a*0.55));g.addColorStop(0.7,ink(a*0.15));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,F.w,F.h)}
function line(a=1,hFrac=1,t=0,glow=RESTBLOOM,x=G.xRc,y=G.cyc){if(a<=0.002||hFrac<=0.001)return;const coreA=(0.92+0.08*Math.sin(t*1.4))*a;ctx.shadowColor=white(0.9*coreA);ctx.shadowBlur=(8+14*glow)*DPR;ctx.fillStyle=white(coreA);
  ctx.fillRect(x-G.cw,y-G.hFc*hFrac,G.cw,2*G.hFc*hFrac);ctx.shadowBlur=0}
function dot(x,y,r,a,glow=0){if(a<=0.003||r<=0)return;if(glow>0){ctx.shadowColor=ink(a);ctx.shadowBlur=glow*DPR}else ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(x,y,Math.max(0.4,r),0,Math.PI*2);ctx.fillStyle=ink(a);ctx.fill();ctx.shadowBlur=0}
const shimmer=(p,t)=>{const w=Math.sin(p.u*3.4-t*1.6)*0.5+0.5,w2=Math.sin(p.v*2.0+p.u*2.0-t*0.9)*0.5+0.5,twk=0.85+0.15*Math.sin(t*2.3+p.i*1.7+p.j*0.9);return Math.min(1,(0.60+0.34*w)*twk+w*w2*0.42)};
const glowOf=p=>{const n=1-p.u/MARK.fieldEnd;return n>0.45?(2+n*9):0};
const lineY=p=>G.cyc+(p.v-0.5)*2*G.hFc;
const rest=(t)=>{clear();bloom(RESTBLOOM);line(1,1,t)};
/* the mark's rails + bleed (ported) */
function frameOf(env,t){if(env<=0.004)return;const {xLc,xRc,cyc,hFc,hLc,K}=G;
  const g=ctx.createLinearGradient(xLc,0,xRc,0);for(const [o,a] of RAIL)g.addColorStop(o,ink(a*env));const th=MARK.railThick*K;
  for(const s of [-1,1]){const yF=cyc+s*hFc,yN=cyc+s*hLc;ctx.beginPath();ctx.moveTo(xRc,yF-th);ctx.lineTo(xRc,yF+th);ctx.lineTo(xLc,yN);ctx.closePath();ctx.fillStyle=g;ctx.fill()}
  const benv=env*(0.9+0.1*Math.sin(t*0.8));const bx=G.mapX(MARK.xR-MARK.bleedW),hb=halfH(MARK.xR-MARK.bleedW)*K;
  const g2=ctx.createLinearGradient(bx,0,xRc,0);for(const [o,a] of BLEED)g2.addColorStop(o,white(a*benv));
  ctx.beginPath();ctx.moveTo(bx,cyc-hb);ctx.lineTo(xRc,cyc-hFc);ctx.lineTo(xRc,cyc+hFc);ctx.lineTo(bx,cyc+hb);ctx.closePath();ctx.fillStyle=g2;ctx.fill()}
/* a full-frame grid of many small dots — the "screensaver field" shared by gridripple + figure */
const FIELD=(()=>{const sp=F.h/14,m=sp*0.6;const cols=Math.max(12,Math.floor((F.w-2*m)/sp)),rows=Math.max(6,Math.floor((F.h-2*m)/sp));
  const ox=(F.w-(cols-1)*sp)/2,oy=(F.h-(rows-1)*sp)/2;const pts=[];let k=0;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){pts.push({x:ox+i*sp,y:oy+j*sp,i,j,m:G.dots[k%G.dots.length],own:k>=G.dots.length,seed:Math.random()});k++}
  return{pts,cols,rows,sp,ox,oy,r:Math.max(1.4,F.h*0.0045),groundY:oy+(rows-2)*sp}})();
const wave=(p,t,phase0)=>{const d=Math.hypot(p.x-F.w/2,p.y-F.h/2)/Math.hypot(F.w/2,F.h/2);return Math.max(0,Math.sin(d*6.5-(t-phase0)*0.9))};
/* field in/out — shared by gridripple + figure. in: line → field over [a,b]; out: field → line over [a,b] */
function fieldIn(t,a,b){for(const p of FIELD.pts){const k=easeIO(seg(t,a+p.m.u*0.25*(b-a),b));
  if(p.own){dot(p.x,p.y,FIELD.r,0.3*k)}else{dot(lerp(G.xRc,p.x,k),lerp(lineY(p.m),p.y,k),lerp(1.2,FIELD.r,k),0.3+0.2*(1-k))}}
  line(1-seg(t,a+(b-a)*0.55,b),1,t,RESTBLOOM)}
function fieldOut(t,a,b,base){for(const p of FIELD.pts){const k=easeIO(seg(t,a+(1-p.m.u)*0.25*(b-a),b));
  if(p.own){dot(p.x,p.y,FIELD.r,base(p)*(1-k))}else{dot(lerp(p.x,G.xRc,k),lerp(p.y,lineY(p.m),k),lerp(FIELD.r,1.2,k),base(p)*(1-k)+0.3*k*(1-k))}}
  line(seg(t,a+(b-a)*0.45,b),1,t,RESTBLOOM)}

/* ═══════════ variations — each starts at rest and ends at rest (held REST s) ═══════════ */
const V={};
/* mark — the brand loop, with a real rest state. build 6 · hold 14 · dissolve 5 · rest 3 */
function drawMark(t,buildAmt=1,dissolve=0,frameA=1,halo=1){
  const built=1-Math.pow(1-buildAmt,3),front=built*1.2,bloomAmt=built*(1-easeIO(dissolve));
  bloom((RESTBLOOM+(1-RESTBLOOM)*bloomAmt*(0.88+0.12*Math.sin(t*0.7)))*halo);
  for(const p of G.dots){const rev=clamp01((front-p.u)/0.14);if(rev<=0)continue;let out=0;
    if(dissolve>0){const ds=(1-p.u)*0.62+p.rand*0.32;out=clamp01((dissolve-ds)/0.16)}if(rev*(1-out)<=0)continue;
    const a=shimmer(p,t)*rev*(1-out),rad=Math.max(0.5,p.R*(0.4+0.6*rev)*(0.35+0.65*(1-out)));dot(p.X,p.Y,rad,a,glowOf(p))}
  frameOf(frameA*(1-dissolve),t);line(1,1,t,RESTBLOOM+(1-RESTBLOOM)*bloomAmt)}
V.mark=(()=>{const tB=6,tH=14,tD=5,T=tB+tH+tD+REST;return t=>{clear();
  let buildAmt=1,dissolve=0,phase;
  if(t<tB){phase='build';buildAmt=t/tB}else if(t<tB+tH)phase='hold';else if(t<tB+tH+tD){phase='dissolve';dissolve=(t-tB-tH)/tD}else phase='rest';
  wm.classList.toggle('on',phase==='hold');
  drawMark(t,buildAmt,dissolve,clamp01((t-0.32*tB)/(0.68*tB)));
  return t>=T}})();
/* power-on: the whole surface wakes — a wash of light, a hairline across the width, it collapses to a point, the line grows */
V.poweron=t=>{clear();if(t<0.8)return false;
  wash(0.22*bump(t,0.8,3.6));
  const hl=bump(t,1.6,3.4);if(hl>0){const spread=1-easeI(seg(t,2.2,3.35));const half=(F.w*0.5)*spread+2;ctx.fillStyle=white(0.35+0.6*(1-spread));ctx.fillRect(G.xRc-half,G.cyc-0.75,half*2,1.5)}
  if(t>3.2&&t<3.7)dot(G.xRc-G.cw/2,G.cyc,G.cw*2.4*bump(t,3.2,3.7)+1,1,22);
  if(t>3.55){const flick=(t<4.3&&Math.floor(t*30)%5===0)?0.45:1;const h=easeOB(seg(t,3.55,5.2));line(flick,Math.max(0.01,h),t,RESTBLOOM+0.7*bump(t,4.2,6.6));bloom(RESTBLOOM+0.7*bump(t,4.2,6.6))}
  return t>=6.6+REST};
/* power-off: the reverse, then black */
V.poweroff=t=>{clear();if(t<1.2){rest(t);return false}
  const h=1-easeI(seg(t,1.2,2.6));if(h>0.01){line(1,h,t,RESTBLOOM);bloom(RESTBLOOM*h)}
  if(t>2.4&&t<2.9)dot(G.xRc-G.cw/2,G.cyc,G.cw*2.6*bump(t,2.4,2.9)+1,1,26);
  const hl=bump(t,2.7,3.9);if(hl>0){const spread=easeO(seg(t,2.7,3.5));ctx.fillStyle=white(0.9*(1-seg(t,3.3,3.9)));ctx.fillRect(G.xRc-F.w*0.5*spread,G.cyc-0.75,F.w*spread,1.5)}

function strokeFt(st){const ppf=pxPerFt();if(!st.anchor)return st.t==='text'?[{x:st.x,y:st.y}]:st.pts;const cv=p=>{const s2=toSurfPx(p);return {x:s2.x/ppf,y:s2.y/ppf}};return st.t==='text'?[cv(st)]:st.pts.map(cv)}
function inkHit(pt){const tol=0.35;for(let i=INK.strokes.length-1;i>=0;i--){const st=INK.strokes[i];if(!inkVisible(st))continue;const pts=strokeFt(st);if(st.t==='text'){if(Math.hypot(pts[0].x-pt.x,pts[0].y-pt.y)<Math.max(tol,(st.text.length*0.3)))return i;continue}
  for(const q2 of pts)if(Math.hypot(q2.x-pt.x,q2.y-pt.y)<tol)return i}return -1}
inkEl.addEventListener('mousedown',e=>{if(!INK.on)return;e.preventDefault();e.stopPropagation();const pt=inkPt(e);
  if(INK.tool==='erase'){const i=inkHit(pt);if(i>=0){INK.strokes.splice(i,1);paintInk();report()}return}
  if(INK.tool==='text'){const i=inkHit(pt);if(i>=0&&INK.strokes[i].t==='text'){const at=strokeFt(INK.strokes[i])[0];INK.drag={i,dx:at.x-pt.x,dy:at.y-pt.y};return}   /* drag words to move them */
    const text=prompt('the words');if(text){INK.strokes.push(anchorStroke({t:'text',x:pt.x,y:pt.y,text,size:0.6}));paintInk();report()}return}
  INK.cur={t:'line',pts:[pt],w:0.045}});

document.addEventListener('keydown',e=>{if(!INK.on||e.target.tagName==='INPUT')return;if((e.key==='z'||e.key==='Z')&&!e.altKey){INK.strokes.pop();paintInk();report();e.preventDefault()}});
async function inkSave(){inkSize();const out=document.createElement('canvas');out.width=F.w;out.height=F.h;const c=out.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,out.width,out.height);
  const layers=()=>{try{c.drawImage(stage,-F.x,-F.y)}catch(e){}try{if(fx&&fx.width)c.drawImage(fx,-F.x,-F.y)}catch(e){}
    if(planwrap.style.display==='block'){c.save();c.translate(P.x,P.y);c.scale(P.scale,P.scale);c.translate(plan.width/2,plan.height/2);c.rotate((P.rot||0)*Math.PI/180);c.translate(-plan.width/2,-plan.height/2);c.drawImage(plan,0,0);c.restore()}
    const ppf=pxPerFt();c.save();c.globalCompositeOperation='difference';c.strokeStyle='#fff';c.lineWidth=2;c.font=`300 ${Math.max(10,ppf*0.35)}px system-ui`;c.fillStyle='#fff';c.textAlign='center';
    for(const b of BLOCKS){c.save();c.translate(b.x*ppf,b.y*ppf);c.rotate((b.rot||0)*Math.PI/180);const w=b.w*ppf,d=b.d*ppf;if(b.shape==='round'){c.beginPath();c.ellipse(0,0,w/2,d/2,0,0,Math.PI*2);c.stroke()}else c.strokeRect(-w/2,-d/2,w,d);c.fillText(b.label,0,0);c.restore()}
    c.drawImage(inkEl,0,0);c.restore()};
  let tried=false;const tryImg=()=>{if(imgEl.style.display==='block'&&imgEl.naturalWidth){const r=imgEl.getBoundingClientRect();c.drawImage(imgEl,r.left-F.x,r.top-F.y,r.width,r.height)}};
  tryImg();layers();let blob=await new Promise(res=>{try{out.toBlob(res,'image/png')}catch(e){res(null)}});
  if(!blob){c.fillStyle='#000';c.fillRect(0,0,out.width,out.height);layers();blob=await new Promise(res=>out.toBlob(res,'image/png'))}
  const D=new Date(),z=n=>String(n).padStart(2,'0');const stamp=`${D.getFullYear()}${z(D.getMonth()+1)}${z(D.getDate())}-${z(D.getHours())}${z(D.getMinutes())}`;const name=`${stamp}-${surf}`;   /* local time, so the file reads like the clock on the wall */
  bc&&bc.postMessage({from:surf,ev:'inkfile',name,png:blob,strokes:JSON.stringify({surface:surf,ft:{w:ft.w,h:ft.h},plan:planwrap.style.display==='block'?{name:P.name,page:P.page,x:P.x,y:P.y,scale:P.scale,rot:P.rot}:null,blocks:BLOCKS,strokes:INK.strokes,at:new Date().toISOString()})});
  showHint('markup saved · '+name)}
function inkOp(m){if(m.op==='mode'){INK.on=m.on!==undefined?!!m.on:true;if(m.tool)INK.tool=m.tool;inkEl.classList.toggle('on',INK.on);if(!INK.on)INK.cur=null;showHint(INK.on?`markup · ${INK.tool} · Z undoes`:'markup off')}
  else if(m.op==='add'&&m.stroke){INK.strokes.push(anchorStroke(m.stroke))}else if(m.op==='undo'){if(m.who){for(let i=INK.strokes.length-1;i>=0;i--)if(INK.strokes[i].who===m.who){INK.strokes.splice(i,1);break}}else INK.strokes.pop()}   /* a viewer's undo removes only their own last mark */else if(m.op==='clear'){INK.strokes.length=0;INK.cur=null}else if(m.op==='save'){inkSave();return}

addEventListener('resize',paintInk);
/* ═══════════ band mask ═══════════ */
const maskEl=document.getElementById('mask');let MASK=null;try{MASK=JSON.parse(localStorage.getItem('isc-mask-'+surf))}catch(e){}
function paintMask(){if(!MASK||!MASK.on){maskEl.style.display='none';return}maskEl.style.display='block';maskEl.style.background=`radial-gradient(ellipse ${MASK.r}% ${MASK.r*1.6}% at ${MASK.x}% ${MASK.y}%, rgba(0,0,0,.97) 0%, rgba(0,0,0,.94) 70%, rgba(0,0,0,0) 100%)`}
paintMask();
/* ═══════════ scene switch — always through black ═══════════ */
let sceneName='black',sceneParams={},busy=false,busyT=null;const busyEl=document.createElement('div');busyEl.style.cssText='position:fixed;right:14px;bottom:10px;font:500 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:rgba(247,247,243,.35);display:none;pointer-events:none';busyEl.textContent='LOADING';document.body.appendChild(busyEl);
function setBusy(b){busy=b;busyEl.style.display=b?'block':'none';clearTimeout(busyT);if(b)busyT=setTimeout(()=>{busy=false;busyEl.style.display='none';report()},15000)}
async function setScene(name,params={}){if(!S[name])return;setBusy(true);report();if(q.get('at'))veil.style.transition='none';veil.style.opacity=1;await new Promise(r=>setTimeout(r,720));teardown();sceneName=name;sceneParams=params;showHint(name);
  try{await document.fonts.load(FONT(200,40));await document.fonts.load(FONT(300,20))}catch(e){}
  try{await S[name](params)}catch(e){console.error(e)}if(name!=='video'&&name!=='image')setBusy(false);veil.style.opacity=0;report()}
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();paused=!paused}if(e.key==='Escape')setScene('black')});
/* a wall that is not truly fullscreen (title bar showing) goes fullscreen on its first click */
/* Full screen is deliberate: F toggles it. A click used to do it, which changed the window's size under a frame calibrated at another size. [2026-09-15] */
document.addEventListener('keydown',e=>{if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!q.get('mock')&&!q.get('mirror')){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen().catch(()=>{})}});
function checkWin(){if(q.get('mock')||q.get('mirror')||q.get('f'))return;let w=null;try{w=JSON.parse(localStorage.getItem('isc-win-'+surf)||'null')}catch(e){}if(!w)return;
  const off=Math.abs(w.w-innerWidth)>4||Math.abs(w.h-innerHeight)>4;hint.style.color=off?'#ff5a1f':'';hint.style.fontSize=off?'14px':'';
  if(off)hint.textContent=`this window is ${innerWidth}×${innerHeight} but the frame was calibrated at ${w.w}×${w.h}${w.fs?' (full screen)':' (not full screen)'} · the scale is off · press F to match, or calibrate again`;else if(/calibrated at/.test(hint.textContent))showHint(sceneName)}
setTimeout(checkWin,2500);addEventListener('resize',()=>setTimeout(checkWin,700));

/* ═══════════ remote ═══════════ */
const bc=('BroadcastChannel' in window)?new BroadcastChannel('isc-show'):null;
function report(){if(q.get('mirror'))return;bc&&bc.postMessage({from:surf,ev:'state',busy,build:document.lastModified,scene:sceneName,page:P.page,pages:planwrap.style.display==='block'&&P.doc?P.doc.numPages:0,slide,slides:DECK?DECK.length:0,deck:DECKFILE,held:HELD,lock:LOCK,blocks:BLOCKS.map(b=>({id:b.id,label:b.label,w:b.w,d:b.d,x:+b.x.toFixed(2),y:+b.y.toFixed(2),rot:b.rot||0,shape:b.shape,on:b.id===BSEL})),ink:{on:INK.on,tool:INK.tool,n:INK.strokes.length},frame:F,ft:{w:ft.w,h:ft.h},plan:planwrap.style.display==='block'?{name:P.name||'',page:P.page,unitsPerFt:P.unitsPerFt,x:P.x,y:P.y,rot:P.rot,scale:P.scale,S:P.S,pw:plan.width}:null,params:sceneParams?Object.fromEntries(Object.entries(sceneParams).filter(([k,v])=>k!=='file'&&!(typeof Blob!=='undefined'&&v instanceof Blob))):null,at:Date.now()})}
const WHILE_HELD=['hold','ping','reload','nudge','zoom','rotate','page','center','view','reset','lock','mask','block','ink','planurl'];
/* A mirror (a tile on the desk or the remote) follows its wall's state reports: scene, sheet, page, position and scale converted to the tile's
   own size. Pixel commands (nudge, zoom, view…) are ignored there; they would land wrong at a different size. A mirror that opens late catches up
   on the next report. Plans sent as a file (from this PC) still arrive over the local channel; a remote tile can only follow plans with an address. [2026-09-15] */
const MIRROR=!!q.get('mirror');let mirrorKey='';
/* a tile's drag and pinch move this mirror at once, in the tile's own pixels; the wall's next report then lines it up exactly */
if(MIRROR)window.__iscMirror={drag:false,bdrag:null,blockGrab:id=>{window.__iscMirror.bdrag=id},blockMove:(id,dx,dy)=>{const b=BLOCKS.find(x=>x.id===id);if(!b)return;b.x+=dx;b.y+=dy;BSEL=id;paintBlocks()},nudge:(dx,dy)=>{if(planwrap.style.display!=='block')return;P.x+=dx;P.y+=dy;placePlan()},zoom:(k,cx,cy)=>{if(planwrap.style.display!=='block'||LOCK)return;P.x=cx-(cx-P.x)*k;P.y=cy-(cy-P.y)*k;P.scale*=k;placePlan()}};
if(MIRROR&&bc){const ask=()=>bc.postMessage({to:surf,cmd:'ping'});setTimeout(ask,800);addEventListener('isc-relay',e=>{if(e.detail&&e.detail.on)setTimeout(ask,300)})}   /* a tile that opens late asks its wall for a report at once (and again after a reconnect) */
async function mirrorFollow(m){if(busy)return;const ratio=m.frame&&m.frame.w?F.w/m.frame.w:1;const p=m.plan;const havePlan=planwrap.style.display==='block';
  const same=m.scene===sceneName&&(m.scene!=='plan'||(p&&havePlan&&P.name===p.name&&P.page===p.page));
  if(!same){const key=m.scene+'|'+(p?p.name+'|'+p.page:'')+'|'+(m.params&&m.params.url||'')+'|'+(m.deck||'');if(key===mirrorKey)return;mirrorKey=key;
    if(m.scene==='plan'){if(!(m.params&&m.params.url))return;await setScene('plan',{url:m.params.url,name:p&&p.name,page:p?p.page:1,unitsPerFt:p?p.unitsPerFt:null,rot:p?p.rot:0})}
    else if(m.scene==='deck'){await setScene('deck',{index:m.slide||0,deck:m.deck});return}
    else{await setScene(m.scene,m.params||{});return}}
  if(m.scene==='plan'&&p&&planwrap.style.display==='block'&&p.pw&&plan.width&&!window.__iscMirror.drag){const nx=p.x*ratio,ny=p.y*ratio,ns=p.scale*ratio*(p.pw/plan.width);if(Math.abs(nx-P.x)>0.5||Math.abs(ny-P.y)>0.5||Math.abs(ns/P.scale-1)>1e-3||(p.rot||0)!==(P.rot||0)){P.x=nx;P.y=ny;P.scale=ns;P.rot=p.rot||0;placePlan()}}
  else if(m.scene==='deck'&&m.slides&&m.slide!==slide)showSlide(m.slide)}
function mirrorBlocks(m){if(!Array.isArray(m.blocks)||window.__iscMirror.bdrag)return;const sig=JSON.stringify(m.blocks);if(sig===mirrorBlocks.sig)return;mirrorBlocks.sig=sig;BLOCKS.length=0;for(const b of m.blocks)BLOCKS.push({id:b.id,label:b.label,w:b.w,d:b.d,x:b.x,y:b.y,rot:b.rot||0,shape:b.shape});BSEL=(m.blocks.find(b=>b.on)||{}).id||null;paintBlocks()}
if(bc)bc.onmessage=async e=>{const m=e.data||{};if(MIRROR&&m.ev==='state'){if(m.from===surf){mirrorBlocks(m);mirrorFollow(m)}return}if(m.to&&m.to!==surf&&m.to!=='all')return;if(MIRROR&&['nudge','zoom','rotate','view','center','reset','page','block'].includes(m.cmd))return;if(HELD&&!WHILE_HELD.includes(m.cmd))return;

  else if(m.cmd==='lock'){LOCK=!!m.on;showHint(LOCK?'scale locked · pan only':'scale unlocked');report()}
  else if(m.cmd==='block'){blockOp(m)}
  else if(m.cmd==='planurl'){if(sceneName==='plan'&&(!m.name||m.name===P.name)){sceneParams={...(sceneParams||{}),url:m.url};report()}}   /* the desk shared this plan by address: the report carries it, so remote tiles can draw it */
  else if(m.cmd==='ink'){inkOp(m)}
  else if(m.cmd==='cast'){if(!MIRROR)castOp(m)}

  else if(m.cmd==='ping')report();else if(m.cmd==='reload')location.reload();else if(m.cmd==='pause')paused=!paused;
  else if(m.cmd==='mask'){MASK={on:!!m.on,x:m.x??90,y:m.y??50,r:m.r??14};try{localStorage.setItem('isc-mask-'+surf,JSON.stringify(MASK))}catch(e){}paintMask()}
  else if(m.cmd==='reset'&&planwrap.style.display==='block'){P.scale=P.unitsPerFt?pxPerFt()/(P.unitsPerFt*P.S):Math.min(F.w/plan.width,F.h/plan.height);P.rot=0;P.x=(F.w-plan.width*P.scale)/2;P.y=(F.h-plan.height*P.scale)/2;placePlan()}
  else if(m.cmd==='slide'){castStop();if(sceneName!=='deck'||(m.deck&&m.deck!==DECKFILE)){await setScene('deck',{index:m.index||0,deck:m.deck})}else if(m.index!==undefined)showSlide(m.index);else showSlide(slide+(m.delta||0))}

    if(m.cmd==='view'){if(m.x!==undefined)P.x=m.x;if(m.y!==undefined)P.y=m.y;if(m.scale)P.scale=m.scale;if(m.rot!==undefined)P.rot=m.rot;placePlan()}
    else if(m.cmd==='nudge'){P.x+=m.dx||0;P.y+=m.dy||0;placePlan()}else if(m.cmd==='zoom'){if(!LOCK){const k=+m.k||1;if(m.cx!==undefined&&m.cy!==undefined){P.x=m.cx-(m.cx-P.x)*k;P.y=m.cy-(m.cy-P.y)*k}P.scale*=k}placePlan()}   /* cx,cy: zoom about that point (a pinch on a tile, or the frame center) */else if(m.cmd==='rotate'){P.rot=(((P.rot||0)+(m.deg===undefined?90:+m.deg))%360+360)%360;placePlan()}

setInterval(report,5000);
