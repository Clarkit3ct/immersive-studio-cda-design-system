// Usage:
//   import { mountImmersiveLoader } from './loader.js';
//   const loader = mountImmersiveLoader(document.querySelector('#logo-box'), {
//     glowColor: '#F7F7F3', speed: 1,
//     hold: false,                      // true = build once, then stay lit (no dissolve loop)
//     staticRender: false,              // true = single fully-built frame, no animation (reduced motion)

const MARK = {
  xL: 290, xR: 560, cy: 500, hL: 340, zL: 1.0, zR: 2.0,
  cols: 12, rows: 22, rNear: 6.2, rMin: 0.7, sizeExp: 2.75,

// Perspective projection of quantity q at WORLD fraction u along the wall

// Same falloff tables as the SVG's gradients.
const BLEED = [[0, 0], [0.42, 0.025], [0.66, 0.08], [0.84, 0.24], [0.94, 0.58], [1, 1]];
const RAIL = [[0, 0], [0.45, 0.1], [0.75, 0.42], [1, 1]];

const VB = (() => {

  const y = MARK.cy - MARK.hL - MARK.rNear - MARK.pad;

      ctx.closePath();

// the travelling bar matches the mark's own bright line: same height, same weight,
// so on impact it reads as merging INTO the logo rather than hitting it.
const MARKH = MH*0.81429;                       // mark ink height on screen
const LINE_H = MARKH*(340/692.4);               // the bright line's height in mark units
const LINE_W = Math.max(3, MARKH*(6.5/692.4));
bar.style.height=LINE_H+'px'; bar.style.width=LINE_W+'px';
bar.style.marginTop=(-LINE_H/2)+'px';
bar.style.boxShadow='0 0 14px rgba(255,255,255,.55), 0 0 40px rgba(255,255,255,.25)';
mountImmersiveLoader(box,{glowColor:'#F7F7F3',speed:1.45,hold:true});
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function ripple(t,T0,DUR){
  const re=(t-T0)/DUR;
  return (re<0||re>1.25) ? null : (u)=>{
    const front=0.90*(1-re)-0.02, d=Math.abs(u-front);
    return Math.exp(-Math.pow(d/0.085,2))*Math.max(0,1-re*0.55);
  };
}

const BAR_IN=1.55, BAR_DUR=0.58, LAND=BAR_IN+BAR_DUR, TOTAL=4.2;
const X0=WW+240, X1=-28;                 // starts off right, ends ON the mark's line
function frame(t){
  const p=cl((t-BAR_IN)/BAR_DUR);
  const e=Math.pow(p,2.15);              // accelerates, then stops dead. no rebound.
  const x=X0+(X1-X0)*e;
  // reveal trails the bar: everything it has already crossed is visible
  const inset=cl(x/WW)*100;
  wmEl.style.clipPath='inset(0 0 0 '+inset+'%)';
  wmEl.style.opacity = (p>0&&x<WW) ? '1' : '0';
  wmEl.style.transform='none';
  // the bar: hot and slightly taller as it closes in, gone the instant it lands
  const closing=Math.pow(p,3);
  bar.style.transform='translateX('+x+'px) scaleY('+(1+0.10*closing)+')';
  bar.style.opacity = (t<BAR_IN) ? '0' : (t>=LAND ? '0' : String(0.85+0.15*closing));
  edge.style.opacity='0';
  // impact: hard flash, mark recoils, ripple runs right→left
  const rc=cl((t-LAND)/0.13);
  box.style.transform=(t>=LAND&&rc<1)?'translateX('+(-4*(1-rc)*Math.cos(rc*3.5))+'px)':'none';
  const decay=1-0.92*cl((t-LAND+0.10)/1.05);
  const fl=Math.exp(-Math.pow((t-LAND)/0.095,2))*1.7;
  window.__GLOW=Math.max(0,decay)+fl;
  window.__RIP=ripple(t,LAND,0.74);
}

function seek(t){ frame(t); FAKE=t*1000; const f=CB; CB=null; if(f) f(FAKE); }
const tp=Q.get('t');
if(tp!==null){ const tt=parseFloat(tp); seek(0); seek(tt);
  setTimeout(()=>{ seek(0); seek(tt); document.title='READY'; },250); }
else { let n=0; setInterval(()=>{ seek((n++/30)%TOTAL); },33); }
</script></body></html>
