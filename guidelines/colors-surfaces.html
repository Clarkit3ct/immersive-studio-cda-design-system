<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:24px 28px;font-family:var(--font-sans)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-hairline)}.pane{background:var(--surface-page);color:var(--text-primary);padding:20px}.t{font-size:14px;line-height:1.9}.chip{margin-top:12px;height:34px;background:var(--surface-raised);border:1px solid var(--border-hairline)}</style></head><body ><div class="pair"><div class="pane"><div class="t" style="font-weight:400">Primary text</div><div class="t" style="color:var(--text-secondary)">Secondary text</div><div class="t" style="color:var(--text-muted)">Muted text</div><div class="chip"></div></div><div class="pane" data-theme="dark"><div class="t" style="font-weight:400">Primary text</div><div class="t" style="color:var(--text-secondary)">Secondary text</div><div class="t" style="color:var(--text-muted)">Muted text</div><div class="chip"></div></div></div></body></html>
