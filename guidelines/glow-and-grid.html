<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:24px 28px;font-family:var(--font-sans)}</style></head><body data-theme="dark"><div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-hairline)"><div style="background:var(--void);height:170px;position:relative;overflow:hidden"><div style="position:absolute;inset:0;color:rgba(247,247,243,.5);background-image:var(--grid-dot);background-size:var(--grid-dot-size)"></div><div style="position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--off-white);box-shadow:var(--glow-edge)"></div></div><div style="background:var(--void);height:170px;background-image:var(--gradient-projection)"></div></div></body></html>
